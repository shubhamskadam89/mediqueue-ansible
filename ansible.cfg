[defaults]
# Single-node inventory is the default; pass -i inventories/multi-node/hosts.ini for 3 servers
inventory = inventories/single-node/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
