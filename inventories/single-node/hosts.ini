# =====================================================================
# MediQueue - SINGLE-NODE inventory (one AWS EC2 Ubuntu instance)
# Ansible is installed on the EC2 instance itself and configures it
# over a local connection. The same host plays all three roles.
# Run:  ansible-playbook site.yml
# =====================================================================

[web]
mediqueue-node ansible_host=127.0.0.1

[app]
mediqueue-node

[db]
mediqueue-node

# Parent group that contains every tier
[mediqueue:children]
web
app
db

[mediqueue:vars]
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
