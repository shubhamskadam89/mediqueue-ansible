# =====================================================================
# MediQueue - MULTI-NODE inventory (3-tier production-style layout)
# Control node: your laptop or a separate EC2 instance with Ansible.
# Replace the <...> placeholders with the PRIVATE IPs of EC2 instances
# in the same VPC and point the key file to your .pem key.
# Run:  ansible-playbook -i inventories/multi-node/hosts.ini site.yml
# =====================================================================

[web]
web01 ansible_host=<WEB_PRIVATE_IP>

[app]
app01 ansible_host=<APP1_PRIVATE_IP>
app02 ansible_host=<APP2_PRIVATE_IP>

[db]
db01 ansible_host=<DB_PRIVATE_IP>

[mediqueue:children]
web
app
db

[mediqueue:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/mediqueue-key.pem
ansible_python_interpreter=/usr/bin/python3
