---
# ---------------- Application ----------------
app_name: MediQueue
app_version: "1.0.0"
app_env: staging
app_user: mediqueue
app_dir: /opt/mediqueue
app_port: 8000
gunicorn_workers: 2

# ---------------- Common / OS ----------------
server_timezone: Asia/Kolkata
base_packages:
  - curl
  - git
  - acl            # needed by Ansible to "become" the postgres user
  - ufw
  - python3-venv
  - python3-pip
  - htop
  - util-linux-extra   # provides hwclock, needed by the timezone module on Ubuntu 24.04+
firewall_enabled: true

# ---------------- Database tier ----------------
db_name: mediqueue_db
db_user: mediqueue_user
# Demo value only. In a real project encrypt it:
#   ansible-vault encrypt_string 'StrongPass' --name db_password
db_password: "Medi@Queue2026"
db_port: 5432

# ---------------- Web tier ----------------
nginx_server_name: _
nginx_listen_port: 80
