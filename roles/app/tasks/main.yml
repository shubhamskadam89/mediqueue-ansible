---
- name: Install the PostgreSQL driver from Ubuntu packages
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/templates"

- name: Copy the Flask application source code
  ansible.builtin.copy:
    src: "app/{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop:
    - app.py
    - requirements.txt
    - templates/index.html
  notify: Restart mediqueue

- name: Create a Python virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
    virtualenv_site_packages: true
  notify: Restart mediqueue

- name: Write the environment file with DB settings
  ansible.builtin.template:
    src: mediqueue.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  notify: Restart mediqueue

- name: Install the systemd unit for Gunicorn
  ansible.builtin.template:
    src: mediqueue.service.j2
    dest: /etc/systemd/system/mediqueue.service
    mode: "0644"
  notify: Restart mediqueue

- name: Enable and start the MediQueue service
  ansible.builtin.systemd:
    name: mediqueue
    state: started
    enabled: true
    daemon_reload: true
